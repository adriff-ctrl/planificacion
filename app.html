<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* Colores corporativos Pool Concept */
  --pc-gris:#555962; --pc-cian:#03A1BE; --cian-texto:#03A1BE;
  --cab:#FFFFFF; --cab-texto:#555962; --cab-suave:#8B8F97; --cab-linea:#DADCE0;
  --fondo:#F2F4F5; --superficie:#FFFFFF; --tinta:#555962; --fuerte:#3E4249; --suave:#80848C;
  --linea:#DADCE0; --no-lab:#E8EAEC;
  /* Tareas: --x es el color de la tarea, --x-f el relleno con texto blanco */
  --fab:#E8891C; --fab-f:#C26F0F;
  --ins:#03A1BE; --ins-f:#02829A;
  --rep:#D0353F; --rep-f:#B82D37;
  --aviso:#7A4F00; --aviso-fondo:#FFF1CF; --error:#B82D37;
  --cond:'Montserrat',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  .vistas{background:rgba(255,255,255,.12)}
  :root{
    color-scheme: dark;
    --cian-texto:#7FDDF0;
    --cab:#555962; --cab-texto:#FFFFFF; --cab-suave:#C9CCD1; --cab-linea:rgba(255,255,255,.25);
    --fondo:#22252A; --superficie:#2D3036; --tinta:#E6E8EB; --fuerte:#FFFFFF; --suave:#A4A8AF;
    --linea:#41454C; --no-lab:#363A40;
    --fab:#F09A35; --rep:#E5525C; --ins:#22B7D3;
    --aviso:#F2C66B; --aviso-fondo:#3A2E12; --error:#F07A82;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pc-cian);outline-offset:2px}
[hidden]{display:none !important}

/* Cabecera */
.cab{position:sticky;top:0;z-index:5;background:var(--cab);color:var(--cab-texto);border-bottom:1px solid var(--cab-linea);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.cab-fila{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.marca{display:flex;align-items:center;gap:12px;margin:0;min-width:0}
.marca img{height:46px;width:auto;display:block}
.marca span{font-weight:700;font-size:15px;color:var(--cian-texto);border-left:2px solid var(--cab-linea);padding-left:12px;white-space:nowrap}
@media (max-width:420px){.marca img{height:38px}.marca span{display:none}}
.vistas{margin-left:auto;display:flex;background:var(--fondo);border-radius:8px;padding:3px}
.vistas button{border:0;background:none;color:var(--cab-texto);padding:5px 14px;border-radius:6px;font-weight:600;font-size:15px}
.vistas button[aria-pressed="true"]{background:var(--pc-cian);color:#fff}
.nav{margin-top:6px}
.mes-titulo{font-family:var(--cond);font-weight:800;font-size:clamp(28px,7vw,44px);line-height:1;margin:0;letter-spacing:-.02em;color:var(--cab-texto)}
.mes-titulo span{color:var(--cian-texto);font-weight:500}
.flechas{margin-left:auto;display:flex;gap:6px}
.flechas button{border:1px solid var(--cab-linea);background:none;color:var(--cab-texto);
  height:38px;min-width:38px;border-radius:8px;font-size:18px;font-weight:600;padding:0 10px}
.flechas .hoy{font-size:15px}
.buscar{flex:1;min-width:0;border:1px solid var(--cab-linea);background:var(--fondo);
  color:var(--cab-texto);border-radius:8px;padding:8px 12px}
.buscar::placeholder{color:var(--cab-suave)}
.terminadas{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;color:var(--cab-suave)}

/* Regleta de tipos: el elemento con color de la app */
.regleta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;max-width:1100px;margin:12px auto 0}
.regleta button{border:0;background:none;color:var(--cab-texto);text-align:left;padding:8px 10px 10px;
  border-bottom:6px solid var(--c);opacity:1;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.regleta button[aria-pressed="false"]{opacity:.45;border-bottom-color:var(--cab-linea)}
.regleta .n{font-family:var(--cond);font-size:20px;font-weight:800;line-height:1;color:var(--c)}
.regleta .nom{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.regleta button{min-width:0}
@media (max-width:420px){.regleta button{padding:8px 6px 10px}.regleta .nom{font-size:13px}.regleta .n{font-size:17px}}
.t-fab{--c:var(--fab);--cf:var(--fab-f)}
.t-ins{--c:var(--ins);--cf:var(--ins-f)}
.t-rep{--c:var(--rep);--cf:var(--rep-f)}

main{max-width:1100px;margin:0 auto;padding:14px 12px}

/* Cronología tipo Gantt con desplazamiento continuo */
.t-fab{--ct:rgba(232,137,28,.22)} .t-ins{--ct:rgba(3,161,190,.20)} .t-rep{--ct:rgba(208,53,63,.18)}
@media (prefers-color-scheme: dark){.t-fab{--ct:rgba(240,154,53,.28)} .t-ins{--ct:rgba(34,183,211,.26)} .t-rep{--ct:rgba(229,82,92,.26)}}
.tl-barra{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.escala{display:flex;background:var(--superficie);border:1px solid var(--linea);border-radius:8px;padding:3px}
.escala button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:600;font-size:14px;color:var(--suave)}
.escala button[aria-pressed="true"]{background:var(--pc-cian);color:#fff}
.tl-ayuda{font-size:13px;color:var(--suave)}
.tl{--izq:150px;position:relative;overflow-x:auto;overflow-y:hidden;background:var(--superficie);
  border:1px solid var(--linea);border-radius:10px;cursor:grab;scrollbar-color:var(--pc-cian) var(--fondo)}
.tl.arrastrando{cursor:grabbing;user-select:none}
.tl::-webkit-scrollbar{height:16px}
.tl::-webkit-scrollbar-track{background:var(--fondo)}
.tl::-webkit-scrollbar-thumb{background:var(--pc-cian);border-radius:8px;border:4px solid var(--fondo)}
.tl-lienzo{position:relative}
.tl-cab{display:flex;border-bottom:1px solid var(--linea)}
.tl-esq{position:sticky;left:0;z-index:6;flex:none;width:var(--izq);background:var(--superficie);border-right:1px solid var(--linea)}
.tl-escala{position:relative;flex:none;height:58px;cursor:pointer}
.tl-mes{position:absolute;top:0;height:58px;border-left:1px solid var(--linea)}
.tl-mes span{position:sticky;left:calc(var(--izq) + 6px);display:inline-block;padding:5px 8px;font-weight:700;font-size:14px;color:var(--fuerte);white-space:nowrap}
.tl-dia{position:absolute;top:28px;height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;line-height:1.15;color:var(--suave)}
.tl-dia b{font-size:12px;color:var(--fuerte)}
.tl-dia.nolab{background:var(--no-lab)}
.tl-dia.fest{background:repeating-linear-gradient(135deg,var(--no-lab) 0 4px,var(--superficie) 4px 8px)}
.tl-dia.lunes{align-items:flex-start;padding-left:3px;border-left:1px solid var(--linea)}
.tl-dia.hoy b{background:var(--pc-cian);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.tl-hoyeti{position:absolute;top:30px;transform:translateX(-50%);background:var(--pc-cian);color:#fff;font-size:11px;font-weight:700;
  padding:2px 6px;border-radius:999px;z-index:2}
.tl-cuerpo{position:relative}
.tl-fondo{position:absolute;top:0;bottom:0;left:var(--izq);pointer-events:none}
.esc-dias .tl-fondo{background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--dpx) - 1px),var(--linea) calc(var(--dpx) - 1px) var(--dpx))}
.tl-nolab{position:absolute;top:0;bottom:0;background:var(--no-lab);opacity:.8}
.tl-fest{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--no-lab) 0 4px,transparent 4px 8px)}
.tl-raya{position:absolute;top:0;bottom:0;width:1px;background:var(--linea)}
.esc-dias .tl-raya{background:var(--suave);opacity:.5}
.tl-hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--pc-cian);z-index:3}
.tl-carril{display:flex;border-bottom:1px solid var(--linea);position:relative}
.tl-carril:last-child{border-bottom:0}
.tl-nom{position:sticky;left:0;z-index:5;flex:none;width:var(--izq);background:var(--superficie);
  border-right:1px solid var(--linea);border-left:5px solid var(--c);padding:10px 10px}
.tl-nom b{display:block;color:var(--c);font-size:15px}
.tl-nom small{color:var(--suave);font-size:12px}
.tl-zona{position:relative;flex:none}
.tl-tarea{position:absolute;height:40px;cursor:pointer;z-index:2;border-radius:6px}
.tl-tarea .fondo{position:absolute;top:0;bottom:0;left:0;background:var(--ct);border-left:4px solid var(--c);border-radius:6px}
.tl-tarea .txt{position:relative;height:100%;padding:0 8px 0 10px;display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
.tl-tarea .p{font-weight:700;font-size:13px;color:var(--fuerte)}
.tl-tarea .s{font-size:11.5px;color:var(--suave)}
.tl-tarea:hover .fondo{box-shadow:0 0 0 2px var(--c)}
.tl-tarea:focus-visible{outline:3px solid var(--pc-cian);outline-offset:2px}
.tl-vacio{padding:18px 14px;color:var(--suave)}
.tl-desliz{display:flex;align-items:center;gap:12px;margin:12px 2px 0;font-size:13px;font-weight:600;color:var(--suave);white-space:nowrap}
.tl-desliz input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:var(--linea);margin:0;cursor:pointer}
.tl-desliz input::-webkit-slider-thumb{-webkit-appearance:none;width:64px;height:26px;border-radius:13px;background:var(--pc-cian);
  border:3px solid var(--superficie);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tl-desliz input::-moz-range-thumb{width:58px;height:20px;border-radius:13px;background:var(--pc-cian);border:3px solid var(--superficie)}
@media (max-width:640px){
  .tl{--izq:92px}
  .tl-nom{padding:8px 6px}
  .tl-nom b{font-size:12px}
  .tl-ayuda{display:none}
}

/* Detalle del día y lista */
.detalle{margin-top:18px}
h2{font-family:var(--cond);font-weight:800;font-size:22px;color:var(--fuerte);margin:0 0 6px;line-height:1.1}
.nota{margin:0 0 10px;color:var(--suave);font-weight:500}
.tareas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tarea{background:var(--superficie);border:1px solid var(--linea);border-left:7px solid var(--c);
  border-radius:8px;padding:10px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tarea:hover{border-color:var(--c)}
.tarea .tipo{font-size:13px;font-weight:700;color:var(--c)}
.tarea .proy{font-size:18px;font-weight:700;line-height:1.25;color:var(--fuerte)}
.tarea .fechas{font-weight:600}
.tarea .dato{color:var(--suave);font-size:15px}
.tarea .dato b{color:var(--tinta);font-weight:600}
.tarea a{color:var(--pc-cian);font-weight:600}
.tarea .obs{font-size:15px;color:var(--suave);white-space:pre-wrap;border-top:1px dashed var(--linea);margin-top:5px;padding-top:5px}
.grupo{margin:22px 0 8px}
.vacio{background:var(--superficie);border:1px dashed var(--linea);border-radius:8px;padding:16px;color:var(--suave)}
.enlace{border:0;background:none;color:var(--pc-cian);font-weight:700;padding:0;text-decoration:underline}

/* Botón flotante */
.nueva{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  border:0;background:var(--pc-cian);color:#fff;font-weight:700;font-size:16px;
  padding:14px 20px;border-radius:12px;box-shadow:0 6px 18px rgba(3,80,95,.35)}

/* Formulario */
dialog{border:0;padding:0;border-radius:14px;width:min(560px,100%);max-height:94vh;
  background:var(--superficie);color:var(--tinta)}
dialog::backdrop{background:rgba(8,22,28,.55)}
@media (max-width:640px){
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:92vh}
}
form{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.form-cab{display:flex;align-items:center;justify-content:space-between}
.form-cab h2{margin:0}
.cerrar{border:0;background:none;font-size:26px;line-height:1;padding:4px 8px;color:var(--suave)}
fieldset{border:0;margin:0;padding:0}
legend,label>span{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;border:2px solid var(--c);color:var(--c);border-radius:8px;
  padding:9px 4px;font-weight:700;margin:0}
.seg input:checked+span{background:var(--cf);border-color:var(--cf);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--tinta);outline-offset:2px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1px solid var(--linea);
  background:var(--fondo);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 120px;gap:10px}
.fin{background:var(--fondo);border-radius:8px;padding:10px 12px;border-left:5px solid var(--c,var(--linea))}
.fin small{display:block;color:var(--suave);font-size:14px}
.fin strong{font-size:17px}
.aviso{background:var(--aviso-fondo);color:var(--aviso);border-radius:8px;padding:10px 12px;font-weight:500}
.aviso button{margin-top:6px;border:1px solid currentColor;background:none;color:inherit;border-radius:6px;padding:4px 10px;font-weight:700}
.error{color:var(--error);font-weight:600;margin:0}
.acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primario{border:0;background:var(--pc-cian);color:#fff;font-weight:700;padding:12px 20px;border-radius:10px}
.secundario{border:1px solid var(--linea);background:none;padding:11px 16px;border-radius:10px;font-weight:600}
.peligro{margin-left:auto;border:0;background:none;color:var(--error);font-weight:700;padding:11px 4px}
.primario:disabled{opacity:.6}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--tinta);color:var(--superficie);padding:10px 16px;border-radius:10px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.cargando{padding:40px 16px;text-align:center;color:var(--suave);font-weight:600}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.toast.accion{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--cian-texto);font-weight:800;padding:2px 0;text-decoration:underline}
@media (prefers-color-scheme: dark){.toast button{color:#0B5F70}}

/* Ordenador: pantalla completa, panel lateral y tareas arrastrables */
@media (min-width:1024px){
  main{max-width:none;padding:14px 20px}
  .cab-fila,.regleta{max-width:none}
  .cab{padding-left:20px;padding-right:20px}
  .tl{--izq:170px}
}
.ayuda-raton{display:none}
@media (pointer:fine){ .ayuda-raton{display:inline} .ayuda-tactil{display:none} .tl-tarea{cursor:grab} }
.tl-tarea .tirador{position:absolute;top:0;bottom:0;width:10px;margin-left:-6px;cursor:ew-resize;border-radius:0 6px 6px 0;z-index:1}
.tl-tarea.sel .fondo{box-shadow:0 0 0 2px var(--c),0 4px 12px rgba(30,35,45,.18)}
.tl-tarea:hover .tirador{background:var(--c);opacity:.55}
@media (pointer:coarse){.tl-tarea .tirador{display:none}}
.tl-tarea.moviendo{z-index:6;cursor:grabbing}
.tl-tarea.moviendo .fondo{box-shadow:0 6px 16px rgba(30,35,45,.25),0 0 0 2px var(--c)}
.tl-tarea.moviendo .s{color:var(--fuerte);font-weight:700}
.tl.arrastrando-tarea{cursor:grabbing;user-select:none}
body.panel{padding-right:440px}
body.panel .nueva{display:none}
dialog.lateral{position:fixed;inset:0 0 0 auto;margin:0;width:440px;max-width:440px;height:100%;max-height:100%;
  border-radius:0;border-left:1px solid var(--linea);box-shadow:-10px 0 28px rgba(30,35,45,.14);z-index:30;overflow:auto}
</style>
</head>
<body>

<script>

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hoyIso() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const HOY = hoyIso();

const E = {
  tareas: [], festivos: new Map(), equipos: [],
  anio: +HOY.slice(0, 4), mes: +HOY.slice(5, 7) - 1,
  vista: 'mes', filtro: new Set(TIPOS), dia: HOY,
  busqueda: '', verTerminadas: false, editId: null, cargado: false
};

/* ---------- Fechas ---------- */
function utc(iso) { const p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function aIso(d) { return d.toISOString().slice(0, 10); }
function sumar(iso, n) { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return aIso(d); }
function finde(iso) { const w = utc(iso).getUTCDay(); return w === 0 || w === 6; }
function laborable(iso) { return !finde(iso) && !E.festivos.has(iso); }
function siguienteLab(iso) { let d = iso; for (let i = 0; i < 60 && !laborable(d); i++) d = sumar(d, 1); return d; }
function calcularFin(inicio, dur) {
  let d = inicio, n = 0, sf = 0, sfest = 0;
  for (let i = 0; i < 3000; i++) {
    if (laborable(d)) { n++; if (n >= dur) return { fin: d, finde: sf, festivos: sfest }; }
    else if (finde(d)) sf++;
    else sfest++;
    d = sumar(d, 1);
  }
  return null;
}
const fLargo = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const fCorto = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const largo = iso => { const s = fLargo.format(utc(iso)); return s.charAt(0).toUpperCase() + s.slice(1); };
const corto = iso => fCorto.format(utc(iso));
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

/* ---------- Servidor ---------- */
function llamar(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}
function aplicar(d) {
  E.tareas = d.tareas || [];
  E.festivos = new Map((d.festivos || []).map(f => [f.fecha, f]));
  E.equipos = d.equipos || [];
  E.cargado = true;
  $('#dlEquipos').innerHTML = E.equipos.map(x => `<option value="${esc(x)}">`).join('');
  const proys = [...new Set(E.tareas.map(t => t.proyecto))].sort((a, b) => a.localeCompare(b, 'es'));
  $('#dlProyectos').innerHTML = proys.map(x => `<option value="${esc(x)}">`).join('');
  render();
}

/* ---------- Pintado ---------- */
const visibles = () => E.tareas.filter(t => E.filtro.has(t.tipo));

function regletaHTML() {
  const inicioMes = `${E.anio}-${pad(E.mes + 1)}-01`;
  const finMes = aIso(new Date(Date.UTC(E.anio, E.mes + 1, 0)));
  return TIPOS.map(tp => {
    const n = E.vista === 'mes'
      ? E.tareas.filter(t => t.tipo === tp && t.inicio <= finMes && t.fin >= inicioMes).length
      : E.tareas.filter(t => t.tipo === tp && (E.verTerminadas || t.fin >= HOY)).length;
    return `<button type="button" class="t-${CLASE[tp]}" data-tipo="${tp}" aria-pressed="${E.filtro.has(tp)}">
      <span class="nom">${tp}</span><span class="n">${n}</span></button>`;
  }).join('');
}

function render() {
  $('#mesTitulo').innerHTML = `${MESES[E.mes]} <span>${E.anio}</span>`;
  $('#navMes').hidden = E.vista !== 'mes';
  $('#navLista').hidden = E.vista !== 'lista';
  document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed', b.dataset.vista === E.vista));
  $('#regleta').innerHTML = regletaHTML();
  if (!E.cargado) return;
  $('#main').innerHTML = E.vista === 'mes' ? htmlGantt() : htmlLista();
  if (E.vista === 'mes') { initTL(); if (dlg.open) marcarSel(E.editId); }
}

/* ---------- Cronología (Gantt) ---------- */
const ESCALAS = { dias: 36, semanas: 14, meses: 4.5 };
const NOM_ESC = { dias: 'Días', semanas: 'Semanas', meses: 'Meses' };
let ESC = 'semanas';
try { ESC = localStorage.getItem('plan-escala') || 'semanas'; } catch (e) {}
if (!ESCALAS[ESC]) ESC = 'semanas';
const entre = (x, y) => Math.round((utc(y) - utc(x)) / 864e5);
const fDM = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const dm = iso => fDM.format(utc(iso));
const finDeMes = iso => aIso(new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7), 0)));

function rangoTL() {
  let a = sumar(HOY, -90), b = sumar(HOY, 330);
  E.tareas.forEach(t => { if (t.inicio < a) a = t.inicio; if (t.fin > b) b = t.fin; });
  a = a.slice(0, 8) + '01';
  b = finDeMes(sumar(finDeMes(b), 1)); // un mes de margen al final
  return { a, b };
}

// Coloca las tareas de un tipo en filas sin que se pisen (barra + texto)
function repartir(ts, a, dpx) {
  const filas = [], out = [];
  ts.forEach(t => {
    const x = entre(a, t.inicio) * dpx;
    const w = (entre(t.inicio, t.fin) + 1) * dpx;
    const p = t.proyecto;
    const s = `${dm(t.inicio)} – ${dm(t.fin)}, ${plural(t.duracion, 'día', 'días')}${t.equipo ? ', ' + t.equipo : ''}`;
    const tw = Math.min(340, Math.max(p.length * 7.8, s.length * 6.4) + 24);
    let f = filas.findIndex(fin => fin + 8 <= x);
    if (f < 0) { f = filas.length; filas.push(0); }
    filas[f] = x + Math.max(w, tw);
    out.push({ t, x, w, f, p, s });
  });
  return { out, n: Math.max(1, filas.length) };
}

function htmlGantt() {
  const dpx = ESCALAS[ESC];
  const { a, b } = rangoTL();
  const nd = entre(a, b) + 1, W = nd * dpx;
  E.tl = { a, dpx };
  const LET = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];

  let h = `<div class="tl-barra"><div class="escala" role="group" aria-label="Escala">${
    Object.keys(ESCALAS).map(k => `<button type="button" data-escala="${k}" aria-pressed="${k === ESC}">${NOM_ESC[k]}</button>`).join('')
  }</div><span class="tl-ayuda"><span class="ayuda-raton">Arrastra una tarea para moverla o su borde derecho para alargarla. Arrastra el fondo o usa la barra de abajo para cambiar de mes.</span><span class="ayuda-tactil">Usa la barra de abajo o desliza el diagrama para moverte entre meses.</span></span></div>`;
  h += `<div class="tl esc-${ESC}" id="tl" style="--dpx:${dpx}px"><div class="tl-lienzo" style="width:calc(var(--izq) + ${W}px)">`;

  // Cabecera: meses y días
  h += `<div class="tl-cab"><div class="tl-esq"></div><div class="tl-escala" id="tlEscala" style="width:${W}px" title="Pulsa un día para crear una tarea">`;
  for (let m = a; m <= b; m = sumar(finDeMes(m), 1)) {
    const fm = finDeMes(m) > b ? b : finDeMes(m);
    h += `<div class="tl-mes" style="left:${entre(a, m) * dpx}px;width:${(entre(m, fm) + 1) * dpx}px"><span>${ESC === 'meses' ? MESES[+m.slice(5, 7) - 1].slice(0, 3) : MESES[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</span></div>`;
  }
  for (let i = 0; i < nd; i++) {
    const d = sumar(a, i), w = utc(d).getUTCDay(), x = i * dpx;
    if (ESC === 'dias') {
      const f = E.festivos.get(d);
      const cls = ['tl-dia'];
      if (!laborable(d)) cls.push(f && !finde(d) ? 'fest' : 'nolab');
      if (d === HOY) cls.push('hoy');
      h += `<div class="${cls.join(' ')}" style="left:${x}px;width:${dpx}px"${f ? ` title="${esc(f.descripcion)}"` : ''}><span>${LET[w]}</span><b>${+d.slice(8)}</b></div>`;
    } else if (w === 1 && ESC === 'semanas') {
      h += `<div class="tl-dia lunes" style="left:${x}px;width:${dpx * 7}px"><b>${+d.slice(8)}</b></div>`;
    }
  }
  if (ESC !== 'dias' && HOY >= a && HOY <= b) h += `<span class="tl-hoyeti" style="left:${(entre(a, HOY) + .5) * dpx}px">Hoy</span>`;
  h += '</div></div>';

  // Fondo: fines de semana, festivos, cambios de mes y hoy
  h += `<div class="tl-cuerpo"><div class="tl-fondo" style="width:${W}px">`;
  let tramo = null;
  const cerrar = () => { if (tramo) h += `<span class="${tramo.c}" style="left:${tramo.i * dpx}px;width:${tramo.n * dpx}px"></span>`; tramo = null; };
  for (let i = 0; i < nd; i++) {
    const d = sumar(a, i);
    const c = laborable(d) ? '' : (E.festivos.has(d) && !finde(d) ? 'tl-fest' : 'tl-nolab');
    if (tramo && tramo.c === c) tramo.n++;
    else { cerrar(); if (c) tramo = { c, i, n: 1 }; }
  }
  cerrar();
  for (let m = sumar(finDeMes(a), 1); m <= b; m = sumar(finDeMes(m), 1)) h += `<span class="tl-raya" style="left:${entre(a, m) * dpx}px"></span>`;
  if (HOY >= a && HOY <= b) h += `<span class="tl-hoy" style="left:${(entre(a, HOY) + .5) * dpx - 1}px"></span>`;
  h += '</div>';

  // Un carril por tipo de tarea
  const tipos = TIPOS.filter(tp => E.filtro.has(tp));
  if (!tipos.length) h += `<div class="tl-vacio">Marca arriba algún tipo de tarea para verlo.</div>`;
  tipos.forEach(tp => {
    const ts = E.tareas.filter(t => t.tipo === tp).sort((x, y) => x.inicio.localeCompare(y.inicio) || x.proyecto.localeCompare(y.proyecto, 'es'));
    const { out, n } = repartir(ts, a, dpx);
    h += `<div class="tl-carril t-${CLASE[tp]}"><div class="tl-nom"><b>${tp}</b><small>${plural(ts.length, 'tarea', 'tareas')}</small></div>
      <div class="tl-zona" style="width:${W}px;height:${n * 48 + 8}px">`;
    out.forEach(o => {
      const tip = o.p + '\n' + o.s + (o.t.ubicacion ? '\n' + o.t.ubicacion : '');
      h += `<div class="tl-tarea" data-id="${esc(o.t.id)}" tabindex="0" role="button" title="${esc(tip)}"
        aria-label="Editar ${esc(tp)}: ${esc(o.p)}, ${esc(o.s)}" style="left:${o.x}px;top:${8 + o.f * 48}px">
        <span class="fondo" style="width:${o.w}px"></span><span class="tirador" style="left:${o.w}px" title="Arrastra para cambiar la duración"></span>
        <span class="txt"><span class="p">${esc(o.p)}</span><span class="s">${esc(o.s)}</span></span></div>`;
    });
    h += '</div></div>';
  });
  h += '</div></div></div>';
  h += `<div class="tl-desliz"><span>${MESES[+a.slice(5, 7) - 1].slice(0, 3)} ${a.slice(0, 4)}</span>
    <input type="range" id="tlRango" min="0" max="1000" step="1" value="0" aria-label="Moverse por los meses">
    <span>${MESES[+b.slice(5, 7) - 1].slice(0, 3)} ${b.slice(0, 4)}</span></div>`;
  return h;
}

// Coloca la vista y sigue el desplazamiento para actualizar el mes del título
function initTL() {
  const el = $('#tl'); if (!el) return;
  const { a, dpx } = E.tl;
  const izq = () => el.querySelector('.tl-esq').offsetWidth;
  const ancho = () => el.clientWidth - izq();
  // El punto de referencia (y el mes del título) está a un cuarto del ancho visible
  el.scrollLeft = entre(a, E.tlCentro || HOY) * dpx - ancho() * 0.25;
  const actualizar = () => {
    const c = sumar(a, Math.floor((el.scrollLeft + ancho() * 0.25) / dpx));
    E.tlCentro = c;
    const anio = +c.slice(0, 4), mes = +c.slice(5, 7) - 1;
    if (anio !== E.anio || mes !== E.mes) {
      E.anio = anio; E.mes = mes;
      $('#mesTitulo').innerHTML = `${MESES[mes]} <span>${anio}</span>`;
      $('#regleta').innerHTML = regletaHTML();
    }
  };
  let pend = false;
  el.addEventListener('scroll', () => { if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; actualizar(); }); } }, { passive: true });
  actualizar();
  // Barra deslizante de debajo: mueve el diagrama por los meses
  const rango = $('#tlRango');
  const maxX = () => Math.max(1, el.scrollWidth - el.clientWidth);
  const sinc = () => { rango.value = Math.round(el.scrollLeft / maxX() * 1000); };
  el.addEventListener('scroll', sinc, { passive: true });
  rango.addEventListener('input', () => { el.scrollLeft = rango.value / 1000 * maxX(); });
  sinc();
  // Arrastrar con el ratón
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const nodo = e.target.closest('.tl-tarea');
    if (nodo) { // mover o alargar una tarea
      const t = E.tareas.find(x => x.id === nodo.dataset.id); if (!t) return;
      e.preventDefault();
      Object.assign(BAR, {
        nodo, t, el, dpx, x: e.clientX, n: 0, movido: false,
        modo: e.target.closest('.tirador') ? 'alargar' : 'mover',
        left: parseFloat(nodo.style.left), fondo: nodo.querySelector('.fondo'),
        tirador: nodo.querySelector('.tirador'), w: parseFloat(nodo.querySelector('.fondo').style.width),
        texto: nodo.querySelector('.s').textContent
      });
      ARR.movido = false;
      return;
    }
    ARR.el = el; ARR.x = e.clientX; ARR.s = el.scrollLeft; ARR.movido = false;
  });
  el.addEventListener('click', e => { if (ARR.movido) { e.stopPropagation(); e.preventDefault(); ARR.movido = false; } }, true);
  // Pulsar un día de la cabecera: nueva tarea ese día
  $('#tlEscala').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    const d = sumar(a, Math.floor((e.clientX - r.left) / dpx));
    abrirForm(null, siguienteLab(d));
  });
}
const ARR = { el: null, x: 0, s: 0, movido: false };
window.addEventListener('pointermove', e => {
  if (!ARR.el) return;
  const dx = e.clientX - ARR.x;
  if (!ARR.movido && Math.abs(dx) > 5) { ARR.movido = true; ARR.el.classList.add('arrastrando'); }
  if (ARR.movido) ARR.el.scrollLeft = ARR.s - dx;
});
window.addEventListener('pointerup', () => { if (ARR.el) ARR.el.classList.remove('arrastrando'); ARR.el = null; });

/* ---------- Mover y alargar tareas con el ratón ---------- */
const BAR = { nodo: null };

// Días laborables entre dos fechas (ambas incluidas)
function contarLab(a, b) { let n = 0; for (let d = a; d <= b; d = sumar(d, 1)) if (laborable(d)) n++; return n; }

// Cómo quedaría la tarea al desplazarla n días
function previa(t, modo, n) {
  if (modo === 'mover') {
    // Si cae en fin de semana o festivo, salta al laborable más cercano en el sentido del arrastre
    let inicio = sumar(t.inicio, n);
    for (let i = 0; i < 30 && !laborable(inicio); i++) inicio = sumar(inicio, n < 0 ? -1 : 1);
    const r = calcularFin(inicio, t.duracion);
    return { inicio, duracion: t.duracion, fin: r ? r.fin : t.fin };
  }
  let finNuevo = sumar(t.fin, n);
  if (finNuevo < t.inicio) finNuevo = t.inicio;
  const duracion = Math.max(1, contarLab(t.inicio, finNuevo));
  const r = calcularFin(t.inicio, duracion);
  return { inicio: t.inicio, duracion, fin: r ? r.fin : t.fin };
}

window.addEventListener('pointermove', e => {
  if (!BAR.nodo) return;
  const dx = e.clientX - BAR.x;
  if (!BAR.movido && Math.abs(dx) > 4) {
    BAR.movido = true; BAR.nodo.classList.add('moviendo'); BAR.el.classList.add('arrastrando-tarea');
  }
  if (!BAR.movido) return;
  let n = Math.round(dx / BAR.dpx);
  if (BAR.modo === 'alargar') n = Math.max(n, -(entre(BAR.t.inicio, BAR.t.fin)));
  if (n === BAR.n) return;
  BAR.n = n;
  if (BAR.modo === 'mover') BAR.nodo.style.left = (BAR.left + n * BAR.dpx) + 'px';
  else {
    const w = Math.max(BAR.dpx, BAR.w + n * BAR.dpx);
    BAR.fondo.style.width = w + 'px'; BAR.tirador.style.left = w + 'px';
  }
  const p = previa(BAR.t, BAR.modo, n);
  BAR.nodo.querySelector('.s').textContent = `${dm(p.inicio)} – ${dm(p.fin)}, ${plural(p.duracion, 'día', 'días')}`;
});

window.addEventListener('pointerup', () => {
  if (!BAR.nodo) return;
  const { t, modo, n, movido, el } = BAR;
  el.classList.remove('arrastrando-tarea');
  BAR.nodo = null;
  if (!movido) return;           // ha sido un clic: se abre la tarea
  ARR.movido = true;             // evita que el clic abra el formulario
  const p = previa(t, modo, n);
  if (p.inicio === t.inicio && p.duracion === t.duracion) { render(); return; }
  cambiarFechas(t.id, p, true);
});

async function cambiarFechas(id, p, conDeshacer) {
  const t = E.tareas.find(x => x.id === id); if (!t) return;
  const antes = { inicio: t.inicio, duracion: t.duracion, fin: t.fin };
  Object.assign(t, p);
  render();
  try {
    const d = await llamar('guardarTarea', Object.assign({}, t));
    aplicar(d);
    if (dlg.open && E.editId === id) abrirForm(E.tareas.find(x => x.id === id));
    const msg = `${t.proyecto}: ${corto(p.inicio)} a ${corto(p.fin)}`;
    toast(msg, conDeshacer ? { texto: 'Deshacer', fn: () => cambiarFechas(id, antes, false) } : null);
  } catch (ex) {
    Object.assign(t, antes); render();
    toast('No se pudo guardar el cambio: ' + ((ex && ex.message) || ex));
  }
}

function irA(fecha, alinear) {
  const el = $('#tl'); if (!el) return;
  const izq = el.querySelector('.tl-esq').offsetWidth, ancho = el.clientWidth - izq;
  const x = (entre(E.tl.a, fecha) + (alinear === 'mes' ? 2 : 0)) * E.tl.dpx - ancho * 0.25;
  el.scrollTo({ left: x, behavior: 'smooth' });
}

function htmlLista() {
  const q = E.busqueda.trim().toLowerCase();
  const ts = visibles()
    .filter(t => E.verTerminadas || t.fin >= HOY)
    .filter(t => !q || [t.proyecto, t.ubicacion, t.equipo, t.observaciones].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.inicio.localeCompare(b.inicio) || a.proyecto.localeCompare(b.proyecto, 'es'));
  if (!ts.length) {
    return `<div class="vacio">${q || E.filtro.size < 3
      ? 'Ninguna tarea coincide con la búsqueda o los tipos marcados.'
      : 'No hay tareas pendientes. Pulsa «Nueva tarea» para planificar la primera.'}</div>`;
  }
  let h = '', grupo = '';
  ts.forEach(t => {
    const g = t.inicio.slice(0, 7);
    if (g !== grupo) {
      if (grupo) h += '</div>';
      grupo = g;
      h += `<h2 class="grupo">${MESES[+g.slice(5) - 1]} ${g.slice(0, 4)}</h2><div class="tareas">`;
    }
    h += tarjeta(t);
  });
  return h + '</div>';
}

function tarjeta(t) {
  const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t.ubicacion);
  return `<article class="tarea t-${CLASE[t.tipo]}" data-id="${esc(t.id)}" tabindex="0" aria-label="Editar ${esc(t.tipo)}: ${esc(t.proyecto)}">
    <span class="tipo">${t.tipo}</span>
    <span class="proy">${esc(t.proyecto)}</span>
    <span class="fechas">${corto(t.inicio)} a ${corto(t.fin)}, ${plural(t.duracion, 'día laborable', 'días laborables')}</span>
    ${t.ubicacion ? `<span class="dato"><b>Ubicación:</b> <a href="${maps}" target="_blank" rel="noopener">${esc(t.ubicacion)}</a></span>` : ''}
    ${t.equipo ? `<span class="dato"><b>Equipo:</b> ${esc(t.equipo)}</span>` : ''}
    ${t.observaciones ? `<span class="obs">${esc(t.observaciones)}</span>` : ''}
  </article>`;
}

/* ---------- Formulario ---------- */
const dlg = $('#dlg'), form = $('#form');
let confirmarBorrado = false;

function tipoElegido() { const r = form.querySelector('input[name=tipo]:checked'); return r ? r.value : ''; }

function abrirForm(t, inicio) {
  E.editId = t ? t.id : null;
  confirmarBorrado = false;
  $('#titForm').textContent = t ? 'Editar tarea' : 'Nueva tarea';
  const tipoDef = t ? t.tipo : (E.filtro.size === 1 ? [...E.filtro][0] : 'Fabricación');
  form.querySelectorAll('input[name=tipo]').forEach(r => r.checked = r.value === tipoDef);
  $('#fProyecto').value = t ? t.proyecto : '';
  $('#fInicio').value = t ? t.inicio : (inicio || (laborable(HOY) ? HOY : siguienteLab(HOY)));
  $('#fDuracion').value = t ? t.duracion : 1;
  $('#fUbicacion').value = t ? t.ubicacion : '';
  $('#fEquipo').value = t ? t.equipo : '';
  $('#fObs').value = t ? t.observaciones : '';
  $('#btnEliminar').hidden = !t;
  $('#btnEliminar').textContent = 'Eliminar tarea';
  $('#formError').hidden = true;
  actualizarFin();
  if (escritorio()) {
    dlg.classList.add('lateral');
    marcarSel(t ? t.id : null);
    document.body.classList.add('panel');
    if (!dlg.open) dlg.show();
  } else {
    dlg.classList.remove('lateral');
    if (!dlg.open) dlg.showModal();
  }
  if (!t) setTimeout(() => $('#fProyecto').focus(), 50);
}

function actualizarFin() {
  const ini = $('#fInicio').value;
  const dur = parseInt($('#fDuracion').value, 10);
  const box = $('#finBox'), aviso = $('#avisoInicio');
  box.className = 'fin' + (tipoElegido() ? ' t-' + CLASE[tipoElegido()] : '');
  aviso.hidden = true;
  if (!ini || !(dur >= 1)) { box.innerHTML = '<small>Fecha de fin</small><strong>Indica el inicio y la duración</strong>'; return; }
  if (!laborable(ini)) {
    const sig = siguienteLab(ini);
    const fest = E.festivos.get(ini);
    const motivo = fest ? 'festivo: ' + fest.descripcion : 'fin de semana';
    aviso.innerHTML = `El ${largo(ini).toLowerCase()} no es laborable (${esc(motivo)}). La tarea empieza a contar el ${largo(sig).toLowerCase()}.
      <br><button type="button" data-mover="${sig}">Empezar ese día</button>`;
    aviso.hidden = false;
  }
  const r = calcularFin(ini, dur);
  if (!r) { box.innerHTML = '<small>Fecha de fin</small><strong>Duración demasiado larga</strong>'; return; }
  const saltos = [];
  if (r.finde) saltos.push(plural(r.finde, 'día de fin de semana', 'días de fin de semana'));
  if (r.festivos) saltos.push(plural(r.festivos, 'festivo', 'festivos'));
  box.innerHTML = `<small>Fecha de fin</small><strong>${largo(r.fin)}</strong>
    ${saltos.length ? `<small>Se saltan ${saltos.join(' y ')}</small>` : ''}`;
}

form.addEventListener('input', actualizarFin);
form.addEventListener('change', actualizarFin);
$('#avisoInicio').addEventListener('click', e => {
  const b = e.target.closest('[data-mover]');
  if (b) { $('#fInicio').value = b.dataset.mover; actualizarFin(); }
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#formError');
  const datos = {
    id: E.editId,
    tipo: tipoElegido(),
    proyecto: $('#fProyecto').value.trim(),
    inicio: $('#fInicio').value,
    duracion: parseInt($('#fDuracion').value, 10),
    ubicacion: $('#fUbicacion').value.trim(),
    equipo: $('#fEquipo').value.trim(),
    observaciones: $('#fObs').value.trim()
  };
  let msg = '';
  if (!datos.tipo) msg = 'Elige el tipo de tarea.';
  else if (!datos.proyecto) msg = 'Escribe el nombre del proyecto.';
  else if (!datos.inicio) msg = 'Elige la fecha de inicio.';
  else if (!(datos.duracion >= 1 && datos.duracion <= 500)) msg = 'La duración debe estar entre 1 y 500 días laborables.';
  if (msg) { err.textContent = msg; err.hidden = false; return; }

  const btn = $('#btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando…'; err.hidden = true;
  try {
    const d = await llamar('guardarTarea', datos);
    aplicar(d);
    const dIni = laborable(datos.inicio) ? datos.inicio : siguienteLab(datos.inicio);
    E.anio = +dIni.slice(0, 4); E.mes = +dIni.slice(5, 7) - 1;
    E.tlCentro = dIni;
    render();
    dlg.close();
    toast(datos.id ? 'Tarea actualizada' : 'Tarea guardada');
  } catch (ex) {
    err.textContent = (ex && ex.message) || String(ex); err.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar tarea';
  }
});

$('#btnEliminar').addEventListener('click', async () => {
  const b = $('#btnEliminar');
  if (!confirmarBorrado) { confirmarBorrado = true; b.textContent = 'Pulsa otra vez para eliminar'; return; }
  b.disabled = true;
  try {
    aplicar(await llamar('eliminarTarea', E.editId));
    dlg.close();
    toast('Tarea eliminada');
  } catch (ex) {
    $('#formError').textContent = (ex && ex.message) || String(ex); $('#formError').hidden = false;
  } finally { b.disabled = false; }
});

$('#btnCancelar').addEventListener('click', () => dlg.close());
$('#btnCerrar').addEventListener('click', () => dlg.close());
const escritorio = () => matchMedia('(min-width: 1024px) and (pointer: fine)').matches;
function marcarSel(id) {
  document.querySelectorAll('.tl-tarea.sel').forEach(n => n.classList.remove('sel'));
  if (id) document.querySelectorAll('.tl-tarea').forEach(n => { if (n.dataset.id === id) n.classList.add('sel'); });
}
dlg.addEventListener('close', () => { document.body.classList.remove('panel'); E.editId = null; marcarSel(null); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && dlg.open && dlg.classList.contains('lateral')) dlg.close(); });

/* ---------- Navegación y eventos ---------- */
function moverMes(n) {
  const d = new Date(Date.UTC(E.anio, E.mes + n, 1));
  if (E.vista === 'mes' && $('#tl')) { irA(aIso(d), 'mes'); return; }
  E.anio = d.getUTCFullYear(); E.mes = d.getUTCMonth();
  render();
}
$('#mesAnt').addEventListener('click', () => moverMes(-1));
$('#mesSig').addEventListener('click', () => moverMes(1));
$('#mesHoy').addEventListener('click', () => {
  if (E.vista === 'mes' && $('#tl')) { irA(HOY); return; }
  E.anio = +HOY.slice(0, 4); E.mes = +HOY.slice(5, 7) - 1; render();
});
$('#btnNueva').addEventListener('click', () => abrirForm(null, null));
$('#buscar').addEventListener('input', e => { E.busqueda = e.target.value; render(); });
$('#verTerminadas').addEventListener('change', e => { E.verTerminadas = e.target.checked; render(); });

document.addEventListener('click', e => {
  const v = e.target.closest('[data-vista]');
  if (v) { E.vista = v.dataset.vista; render(); return; }
  const tp = e.target.closest('[data-tipo]');
  if (tp) { const t = tp.dataset.tipo; E.filtro.has(t) ? E.filtro.delete(t) : E.filtro.add(t); render(); return; }
  const es = e.target.closest('[data-escala]');
  if (es) { ESC = es.dataset.escala; try { localStorage.setItem('plan-escala', ESC); } catch (x) {} render(); return; }
  const nueva = e.target.closest('[data-nueva]');
  if (nueva) { abrirForm(null, siguienteLab(nueva.dataset.nueva)); return; }
  if (e.target.closest('a')) return;
  const card = e.target.closest('[data-id]');
  if (card) { const t = E.tareas.find(x => x.id === card.dataset.id); if (t) abrirForm(t); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest && e.target.closest('[data-id]');
  if (card && e.target === card) { e.preventDefault(); const t = E.tareas.find(x => x.id === card.dataset.id); if (t) abrirForm(t); }
});

let toastT;
function toast(txt, accion) {
  const t = $('#toast');
  t.textContent = txt;
  t.classList.toggle('accion', !!accion);
  if (accion) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = accion.texto;
    b.onclick = () => { t.classList.remove('ver'); accion.fn(); };
    t.appendChild(b);
  }
  t.classList.add('ver');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('ver'), accion ? 6000 : 2200);
}

/* ---------- Arranque ---------- */
render();
llamar('obtenerDatos').then(aplicar).catch(ex => {
  $('#main').innerHTML = `<div class="vacio">No se pudo cargar la planificación: ${esc((ex && ex.message) || ex)}. Recarga la página; si sigue fallando, abre la hoja y ejecuta Planificación › Preparar hojas.</div>`;
});
</script>
</body>
</html>
